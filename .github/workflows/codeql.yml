# Static analysis; results land in the repo's Security → Code scanning tab.
name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: analyze (javascript-typescript)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: javascript-typescript
                  build-mode: none
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:javascript-typescript
