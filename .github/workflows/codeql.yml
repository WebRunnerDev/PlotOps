# Static analysis; results land in the repo's Security → Code scanning tab.
name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: analyze (javascript-typescript)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: javascript-typescript
                  build-mode: none
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: /language:javascript-typescript
