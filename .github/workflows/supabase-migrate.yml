# Production: back up the remote PlotOps DB to R2, apply pending migrations, then
# trigger Cloudflare. No backup -> no migration (docs/BACKUPS.md).
# Check / job name Cloudflare / branch protection may reference: migrate
#
# Cloudflare Pages does not wait for GitHub checks. Order is enforced by:
#   1) disable automatic production deployments in CF
#   2) POST Deploy Hook only after migrate succeeds
name: supabase-migrate

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: supabase-migrate-main
    cancel-in-progress: false

jobs:
    migrate:
        name: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # R2 credentials and the backup key live in this environment (main/dev only).
        environment: production

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
              with:
                  version: 2.109.1

            - name: Link PlotOps project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            - name: Install age
              run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

            - name: Back up database to R2
              env:
                  BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
                  R2_BUCKET: ${{ vars.R2_BUCKET }}
                  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              run: scripts/db-backup.sh pre-migrate

            - name: Push pending migrations
              run: supabase db push

            - name: Security Advisor (remote, fail on error)
              run: |
                  supabase db advisors --linked --type security --level error --fail-on error

    trigger-cloudflare:
        name: trigger-cloudflare
        needs: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Trigger Cloudflare production deploy
              env:
                  DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
              run: |
                  if [ -z "$DEPLOY_HOOK_URL" ]; then
                    echo "CLOUDFLARE_PAGES_DEPLOY_HOOK_URL is not set; skipping CF trigger."
                    echo "Add the secret and disable CF automatic production deploys so migrate runs before the frontend."
                    exit 0
                  fi
                  curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
