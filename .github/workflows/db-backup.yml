# Daily encrypted backup of the production PlotOps database to R2 (30-day
# retention via the bucket's lifecycle + lock rules). The release workflow
# (supabase-migrate) also backs up before every `db push`. See docs/BACKUPS.md.
#
# Scheduled runs use the default branch (dev), so the `production` environment
# allows dev as well as main.
name: db-backup

on:
    schedule:
        - cron: "17 2 * * *" # 02:17 UTC daily
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: db-backup
    cancel-in-progress: false

jobs:
    backup:
        name: backup
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
              with:
                  version: 2.109.1

            - name: Install age
              run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

            - name: Link PlotOps project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            - name: Back up database to R2
              env:
                  BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
                  R2_BUCKET: ${{ vars.R2_BUCKET }}
                  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              run: scripts/db-backup.sh "${{ github.event_name == 'schedule' && 'daily' || 'manual' }}"
